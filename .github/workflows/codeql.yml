name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'

jobs:
  csharp:
    name: csharp
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        shell: pwsh
        working-directory: new_structure_project
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up exact SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: new_structure_project/global.json
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4, resolved 2026-10-26
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended
      - name: Restore locked dependencies
        run: |
          dotnet restore P1.slnx --locked-mode --configfile NuGet.Config -p:NuGetAudit=true -p:DisableTransitiveFrameworkReferenceDownloads=true
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }
      - name: Compile all first-party C# for extraction
        run: ./scripts/Test-PublicSource.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP 'pls-codeql-build') -BuildOnly
      - name: Analyze and upload results
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # same commit as init
        with:
          category: /language:csharp
